<Html>
<script>
function openChromelessIframeWindow(url, width, height) {
  const features = `width=${width},height=${height},menubar=no,toolbar=no,location=no,status=no,scrollbars=no,resizable=no`;
  const win = window.open('', '_blank', features);
  if (win) {
    win.document.write(`
      <body style="margin:0;overflow:hidden;">
        <iframe src="${url}" width="${width}" height="${height}" frameborder="0" style="border:none;display:block;"></iframe>
      </body>
    `);
    win.document.close();
  }
}
</script>

<body>
  <button onclick="openChromelessIframeWindow('testembedexternal.html', 800, 600)">
    Open in Chromeless Window
  </button>
</body>
</Html>
